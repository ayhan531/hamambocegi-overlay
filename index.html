<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Falcı Hamam Böceği — Overlay</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{--altin:#f5c542;--mor:#6b2fbf}
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#12060c;font-family:"Segoe UI",system-ui,sans-serif}
  #sahne{position:absolute;left:50%;top:50%;transform-origin:center center}
  #arkaBulanik{position:fixed;inset:-40px;background-size:cover;background-position:center;filter:blur(28px) brightness(.55);display:none}
  body.yatay #arkaBulanik{display:block}
  .katman{position:absolute;left:0;top:0;width:100%;height:100%}
  #karakter{transform-origin:50% 100%;animation:nefes 3.6s ease-in-out infinite}
  @keyframes nefes{0%,100%{transform:scale(1)}50%{transform:scale(1.006,1.003)}}
  .resim{position:absolute;left:0;top:0;width:100%;height:100%;background-size:100% 100%;background-repeat:no-repeat}
  #cene{will-change:transform}
  #bosluk{position:absolute;border-radius:50%;transform-origin:50% 0;opacity:0;
    background:radial-gradient(ellipse at 50% 35%,#120302 0%,#2a0805 55%,#4a140a 100%)}
  #el{will-change:transform;transform-origin:85% 10%}
  .goz{position:absolute;border-radius:50%;overflow:hidden;pointer-events:none}
  .kapak{position:absolute;left:-5%;width:110%;height:110%;top:-112%;border-radius:0 0 50% 50%;
    background:linear-gradient(180deg,#b2611f 0%,#8a4316 70%,#3a1606 100%);transition:top .07s ease-in}
  .goz.kirp .kapak{top:-6%}
  .mum{position:absolute;width:260px;height:260px;margin:-130px 0 0 -130px;border-radius:50%;mix-blend-mode:screen;
    background:radial-gradient(circle,rgba(255,190,90,.38),rgba(255,140,40,0) 65%);animation:titre 2.1s infinite}
  .mum:nth-child(2){animation-duration:1.7s;animation-delay:-.6s}.mum:nth-child(3){animation-duration:2.6s;animation-delay:-1.1s}
  @keyframes titre{0%,100%{opacity:.75}20%{opacity:1}35%{opacity:.6}60%{opacity:.95}80%{opacity:.7}}
  #kureIsik{position:absolute;border-radius:50%;mix-blend-mode:screen;opacity:0;transition:opacity .6s;
    background:radial-gradient(circle,rgba(220,190,255,.85),rgba(150,80,255,.35) 40%,rgba(120,60,255,0) 70%)}
  .dusunuyor #kureIsik{opacity:1;animation:kure 1.1s ease-in-out infinite alternate}
  @keyframes kure{from{filter:brightness(.8)}to{filter:brightness(1.5)}}

  /* üst bilgi */
  #ust{position:absolute;left:0;right:0;top:92px;text-align:center;pointer-events:none}
  #isimEtiketi{max-width:92%;overflow:hidden;white-space:nowrap;display:inline-flex;align-items:center;gap:10px;background:rgba(20,8,32,.82);border:2px solid var(--altin);
    border-radius:999px;padding:8px 20px 8px 8px;color:#fff;font-weight:900;font-size:27px;opacity:0;transform:translateY(-20px);transition:all .4s}
  #isimEtiketi.goster{opacity:1;transform:none}
  #isimEtiketi img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--altin);display:none}
  #isimEtiketi .kademe{font-size:15px;background:var(--mor);border-radius:999px;padding:3px 10px}
  #sira{position:absolute;right:14px;top:96px;background:rgba(20,8,32,.85);color:var(--altin);border:2px solid var(--altin);
    border-radius:12px;padding:4px 10px;font-weight:800;font-size:18px;display:none}

  /* kartlar */
  .kart{position:absolute;width:var(--w,150px);height:var(--h,258px);perspective:900px;pointer-events:none}
  .kart .ic{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.3,.5,1);transform:rotateY(180deg)}
  .kart.ac .ic{transform:rotateY(0)}
  .kart .yuz,.kart .arka{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;box-shadow:0 12px 28px rgba(0,0,0,.7)}
  .kart .arka{transform:rotateY(180deg);border:3px solid var(--altin);
    background:radial-gradient(circle at 50% 50%,#7b3fd0 0 18%,transparent 19%),
      repeating-conic-gradient(from 0deg at 50% 50%,#2c1250 0 10deg,#4a1f86 10deg 20deg);}
  .kart .arka::after{content:"";position:absolute;inset:10px;border:2px solid rgba(245,197,66,.7);border-radius:8px}
  .kart .yuz{border:3px solid var(--altin);background:#f4ecd8;overflow:hidden}
  .kart .yuz img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .kart.ters .yuz img{transform:rotate(180deg)}
  .kart .adEtiket{position:absolute;left:-30px;right:-30px;top:calc(var(--h,258px) + 6px + var(--fs,19px) * 1.25);text-align:center;color:var(--altin);font-weight:800;font-size:calc(var(--fs,19px) * .78);
    text-shadow:0 0 6px #000,0 0 3px #000;opacity:0;transition:opacity .4s .6s}
  .kart.ac .adEtiket{opacity:1}
    .kart .icerik{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:16px 8px 12px}
  .kart.ters .icerik{transform:rotate(180deg)}
  .kart .no{color:var(--altin);font:700 20px Georgia,serif}
  .kart .sembol{font-size:62px;filter:drop-shadow(0 0 10px rgba(245,197,66,.7))}
  .kart .ad{background:linear-gradient(90deg,#b8862a,#f5d77a,#b8862a);color:#2a1638;font-weight:900;font-size:15px;line-height:1.1;
    padding:5px 6px;border-radius:5px;text-align:center;width:100%}
  .kart .poz{white-space:nowrap;position:absolute;left:-30px;right:-30px;top:calc(var(--h,258px) + 6px);text-align:center;color:#fff;font-weight:900;font-size:var(--fs,19px);
    text-shadow:0 0 6px #000,0 0 3px #000;opacity:0;transition:opacity .4s .5s}
  .kart.ac .poz{opacity:1}
  .kart .tersChip{position:absolute;left:50%;top:-16px;transform:translateX(-50%);background:#c62828;color:#fff;font-weight:900;font-size:13px;
    padding:2px 8px;border-radius:999px;opacity:0;transition:opacity .3s .7s;white-space:nowrap}
  .kart.ters.ac .tersChip{opacity:1}
  .kart.git{transition:opacity .5s, transform .5s;opacity:0;transform:translateY(-30px)}

  /* altyazı */
  #altyazi{position:absolute;left:24px;right:24px;top:810px;text-align:center;white-space:nowrap;overflow:hidden;pointer-events:none;
    font-family:"Arial Black","Segoe UI Black",Impact,sans-serif;font-size:40px;line-height:1.25;color:#fff;text-transform:uppercase;
    -webkit-text-stroke:2px #000;paint-order:stroke fill;text-shadow:0 4px 0 #000,0 0 14px rgba(0,0,0,.8)}
  #altyazi .k{display:inline-block;margin:0 4px;padding:0 6px;border-radius:8px}
  #altyazi .k.simdi{background:#e0245e;-webkit-text-stroke:0;text-shadow:none;box-shadow:0 0 0 3px #fff inset,0 4px 0 #000}
  #altyazi.kucuk{font-size:30px}

  #not{position:absolute;left:0;right:0;bottom:70px;text-align:center;color:#fff;opacity:.7;font-size:13px;text-shadow:0 0 4px #000}

  /* ---- Hediye menüsü (boşta görünür) ---- */
  #menu{position:absolute;left:18px;right:18px;top:96px;transition:opacity .45s, transform .45s;pointer-events:none}
  body.aktif #menu{opacity:0;transform:translateY(-24px)}
  #menu .baslik{text-align:center;margin-bottom:12px;font-family:"Arial Black","Segoe UI Black",Impact,sans-serif;font-size:34px;
    color:#fff;letter-spacing:.5px;-webkit-text-stroke:2px #000;paint-order:stroke fill;text-shadow:0 4px 0 #000,0 0 18px rgba(245,197,66,.55)}
  #menu .baslik b{color:#f5c542}
  #menu .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  #menu .kutu{position:relative;border-radius:18px;padding:12px 6px 10px;text-align:center;
    background:linear-gradient(180deg,rgba(40,14,70,.92),rgba(16,6,30,.92));border:2.5px solid rgba(245,197,66,.85);
    box-shadow:0 6px 0 rgba(0,0,0,.55),0 0 18px rgba(164,107,255,.35) inset}
  #menu .kutu.vip{border-color:#ff4d8d;background:linear-gradient(180deg,rgba(110,14,60,.95),rgba(40,6,24,.95));box-shadow:0 6px 0 rgba(0,0,0,.55),0 0 22px rgba(255,77,141,.6)}
  #menu .ikon{font-size:46px;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.6))}
  #menu .ad{margin-top:6px;font-family:"Arial Black","Segoe UI Black",Impact,sans-serif;font-size:19px;line-height:1.05;color:#fff;
    text-transform:uppercase;-webkit-text-stroke:1.2px #000;paint-order:stroke fill;text-shadow:0 2px 0 #000}
  #menu .fiyat{display:inline-block;margin-top:7px;padding:3px 10px;border-radius:999px;background:#f5c542;color:#1b0f2a;
    font-weight:900;font-size:15px;box-shadow:0 2px 0 rgba(0,0,0,.5)}
  #menu .kutu.vip .fiyat{background:#ff4d8d;color:#fff}
  #menu .not{margin-top:10px;text-align:center;font-weight:900;font-size:17px;color:#fff;-webkit-text-stroke:1px #000;paint-order:stroke fill;
    text-shadow:0 2px 0 #000}
  #menu .not b{color:#f5c542}
  #sesKilit{position:fixed;inset:auto 10px 10px auto;background:#e0245e;color:#fff;font-weight:800;padding:10px 14px;border-radius:10px;
    cursor:pointer;display:none;z-index:9;font-family:sans-serif}
</style>
</head>
<body>
<div id="arkaBulanik"></div>
<div id="sahne">
  <div id="karakter" class="katman">
    <div class="resim" id="taban"></div>
    <div id="mumlar" class="katman"></div>
    <div id="kureIsik"></div>
    <div id="bosluk"></div>
    <div class="resim" id="cene"></div>
    <div id="gozler" class="katman"></div>
    <div class="resim" id="el"></div>
  </div>
  <div id="kartlar" class="katman"></div>
  <div id="ust"><div id="isimEtiketi"><img id="avatar" alt=""><span id="isim"></span><span class="kademe" id="kademe"></span></div></div>
  <div id="sira"></div>
  <div id="altyazi"></div>
  <div id="menu"></div>
</div>
<div id="sesKilit">🔊 Sesi açmak için tıkla</div>

<script>
const params = new URLSearchParams(location.search);
const SESSIZ = params.get('sessiz') === '1';
// Sunucu adresi: overlay yerel sunucudan açıldıysa aynı adres, internetten (GitHub Pages) açıldıysa bilgisayardaki sunucu
const YEREL = /^(localhost|127\.0\.0\.1|192\.168\.)/.test(location.hostname);
const SERVER = params.get('sunucu') || (YEREL ? '' : 'http://127.0.0.1:3000');
const rel = (u) => String(u).replace(/^\//, '');
const KANAL = params.get('kanal') || (YEREL ? '' : 'madamcitir-9b3f844a43c1');   // sesi panel çalacaksa overlay sessiz kalır
const $ = (id) => document.getElementById(id);
const IKON = { tek: '🌹', uc: '🔮', ask: '💘', kariyer: '💰', hayat: '🌙', genel: '👑' };
const KISA = { tek: 'Günün Kartı', uc: 'Üçlü Tarot', ask: 'Aşk Falı', kariyer: 'Para Falı', hayat: 'Hayat Yolu', genel: 'Büyük Açılım' };
const VARSAYILAN_KADEME = [{ key: 'tek', min: 1 }, { key: 'uc', min: 10 }, { key: 'ask', min: 50 }, { key: 'kariyer', min: 100 }, { key: 'hayat', min: 199 }, { key: 'genel', min: 499 }];
let K = null, ws, curId = null, W = 768, H = 1344;

// ---------- Karakteri kur ----------
async function kur() {
  K = await (await fetch('karakter/karakter.json?v=' + Date.now())).json();
  W = K.genislik; H = K.yukseklik;
  const sahne = $('sahne');
  sahne.style.width = W + 'px'; sahne.style.height = H + 'px';
  for (const id of ['taban', 'cene', 'el', 'arkaBulanik']) $(id).style.backgroundImage = `url(${rel(K.resim)})`;
  const poly = (pts) => `polygon(${pts.map(([x, y]) => `${(x / W) * 100}% ${(y / H) * 100}%`).join(',')})`;
  $('cene').style.clipPath = poly(K.cene.poligon);
  $('el').style.clipPath = poly(K.el.poligon);
  const b = K.cene.bosluk, bo = $('bosluk');
  Object.assign(bo.style, { left: b.x - b.rx + 'px', top: b.y - 4 + 'px', width: b.rx * 2 + 'px', height: b.ry * 2 + 'px' });
  const ku = K.kure, ki = $('kureIsik');
  Object.assign(ki.style, { left: ku.x - ku.r + 'px', top: ku.y - ku.r + 'px', width: ku.r * 2 + 'px', height: ku.r * 2 + 'px' });
  $('mumlar').innerHTML = (K.mumlar || []).map(([x, y]) => `<div class="mum" style="left:${x}px;top:${y}px"></div>`).join('');
  $('gozler').innerHTML = (K.gozler || []).map((g) =>
    `<div class="goz" style="left:${g.x - g.rx}px;top:${g.y - g.ry}px;width:${g.rx * 2}px;height:${g.ry * 2}px"><div class="kapak"></div></div>`).join('');
  olcekle(); addEventListener('resize', olcekle);
  kirpLoop();
}
function olcekle() {
  // dikey ekranda ekranı doldur, yatay/kare ekranda tamamı görünsün
  const yatay = innerWidth / innerHeight > 0.7;
  document.body.classList.toggle('yatay', yatay);
  const s = yatay ? Math.min(innerWidth / W, innerHeight / H) : Math.max(innerWidth / W, innerHeight / H);
  $('sahne').style.transform = `translate(-50%,-50%) scale(${s})`;
}
function kirpLoop() {
  setTimeout(() => {
    document.querySelectorAll('.goz').forEach((g) => g.classList.add('kirp'));
    setTimeout(() => document.querySelectorAll('.goz').forEach((g) => g.classList.remove('kirp')), 140);
    kirpLoop();
  }, 2500 + Math.random() * 3500);
}

// ---------- Ağız (sesle senkron) ----------
const audio = new Audio();
audio.crossOrigin = 'anonymous';
let actx = null, analyser = null, buf = null, acik = 0, sahteKonusma = false;
function sesGrafigi() {
  if (actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  const src = actx.createMediaElementSource(audio);
  analyser = actx.createAnalyser(); analyser.fftSize = 1024;
  buf = new Float32Array(analyser.fftSize);
  src.connect(analyser);
  if (!SESSIZ) analyser.connect(actx.destination);
}
function agizDongu() {
  let hedef = 0;
  if (analyser && !audio.paused) {
    analyser.getFloatTimeDomainData(buf);
    let s = 0; for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
    const rms = Math.sqrt(s / buf.length);
    hedef = Math.min(1, Math.max(0, (rms - 0.015) * 9));
  } else if (sahteKonusma) {
    const t = performance.now() / 1000;
    hedef = Math.max(0, Math.sin(t * 17) * 0.5 + Math.sin(t * 7.3) * 0.35 + 0.15);
  }
  acik = acik * 0.55 + hedef * 0.45;
  const m = K ? K.cene.maxAcilma : 12;
  $('cene').style.transform = `translateY(${(acik * m).toFixed(2)}px)`;
  const bo = $('bosluk');
  bo.style.opacity = acik > 0.04 ? 1 : 0;
  bo.style.transform = `scaleY(${(0.2 + acik * 0.9).toFixed(3)})`;
  altyaziGuncelle();
  requestAnimationFrame(agizDongu);
}

// ---------- Kartları elle çekme ----------
function boyut(n) {
  if (n <= 3) return { w: 150, h: 258, fs: 19, gap: 40 };
  if (n <= 5) return { w: 118, h: 203, fs: 17, gap: 22 };
  return { w: 104, h: 179, fs: 15, gap: 18 };
}
function slotlar(n) {
  const b = boyut(n);
  const satirlar = n <= 5 ? [n] : [4, n - 4];
  const out = [];
  satirlar.forEach((k, r) => {
    const top = 150 + r * (b.h + b.fs * 2.6 + 14);
    const genislik = k * b.w + (k - 1) * b.gap;
    const x0 = (W - genislik) / 2;
    for (let i = 0; i < k; i++) out.push([x0 + i * (b.w + b.gap), top + (n === 3 && i !== 1 ? 18 : 0)]);
  });
  return out;
}
function kartHTML(c, pos) {
  return `<div class="ic"><div class="arka"></div><div class="yuz"><img src="kartlar/${c.id}.jpg" alt=""></div></div>
    <div class="tersChip">↻ TERS</div><div class="poz">${pos}</div><div class="adEtiket">${esc(c.name)}</div>`;
}
function elCek() {
  $('el').animate([
    { transform: 'translate(0,0) rotate(0)' },
    { transform: 'translate(-4px,-20px) rotate(-3deg)', offset: 0.45 },
    { transform: 'translate(0,0) rotate(0)' },
  ], { duration: 750, easing: 'ease-in-out' });
}
function kartlariCek(cards) {
  cards.forEach((c) => { const im = new Image(); im.src = `kartlar/${c.id}.jpg`; });
  const kap = $('kartlar');
  kap.innerHTML = '';
  const sl = slotlar(cards.length);
  const [sx, sy] = K.el.kartBaslangic;
  cards.forEach((c, i) => {
    const pos = c.pozisyon || (cards.length === 3 ? ['Geçmiş', 'Şimdi', 'Gelecek'][i] : 'Senin kartın');
    const b = boyut(cards.length);
    const el = document.createElement('div');
    el.className = 'kart' + (c.reversed ? ' ters' : '');
    el.style.left = sl[i][0] + 'px'; el.style.top = sl[i][1] + 'px'; el.style.opacity = 0;
    el.style.setProperty('--w', b.w + 'px'); el.style.setProperty('--h', b.h + 'px'); el.style.setProperty('--fs', b.fs + 'px');
    el.innerHTML = kartHTML(c, pos);
    kap.appendChild(el);
    const dx = sx - (sl[i][0] + b.w / 2), dy = sy - (sl[i][1] + b.h / 2);
    setTimeout(() => {
      elCek();
      setTimeout(() => {
        el.style.opacity = 1;
        el.animate([
          { transform: `translate(${dx}px,${dy}px) scale(.32) rotateX(68deg) rotateZ(-25deg)`, opacity: 0 },
          { transform: `translate(${dx * 0.85}px,${dy * 0.85 - 30}px) scale(.45) rotateX(40deg) rotateZ(-15deg)`, opacity: 1, offset: 0.2 },
          { transform: 'translate(0,0) scale(1) rotateX(0) rotateZ(0)', opacity: 1 },
        ], { duration: 1050, easing: 'cubic-bezier(.2,.8,.3,1)' });
        setTimeout(() => el.classList.add('ac'), 1150);
      }, 330);
    }, 250 + i * (cards.length > 3 ? 1150 : 1650));
  });
}

// ---------- Altyazı (TikTok tarzı) ----------
let yazi = null; // {kelimeler, zamanlar, gruplar, sure, basla}
function altyaziHazirla(text, sure) {
  const kelimeler = text.replace(/\s+/g, ' ').trim().split(' ');
  const agirlik = kelimeler.map((w) => w.length + 2 + (/[.!?…]$/.test(w) ? 6 : /[,;:]$/.test(w) ? 3 : 0));
  const top = agirlik.reduce((a, b) => a + b, 0);
  let t = 0; const zamanlar = agirlik.map((a) => { const z = t; t += (a / top) * sure; return z; });
  const gruplar = []; let g = [];
  kelimeler.forEach((w, i) => { g.push(i); if (g.length >= 3 || /[.!?…,;:]$/.test(w)) { gruplar.push(g); g = []; } });
  if (g.length) gruplar.push(g);
  yazi = { kelimeler, zamanlar, gruplar, sure, basla: performance.now(), sonGrup: -1 };
}
function altyaziGuncelle() {
  if (!yazi) return;
  const t = !audio.paused && audio.duration ? audio.currentTime : (performance.now() - yazi.basla) / 1000;
  let i = yazi.zamanlar.findIndex((z, k) => t >= z && (k === yazi.zamanlar.length - 1 || t < yazi.zamanlar[k + 1]));
  if (i < 0) i = t >= yazi.sure ? yazi.kelimeler.length - 1 : 0;
  const gi = yazi.gruplar.findIndex((g) => g.includes(i));
  const el = $('altyazi');
  if (gi !== yazi.sonGrup) {
    yazi.sonGrup = gi;
    const g = yazi.gruplar[gi] || [];
    el.className = g.map((k) => yazi.kelimeler[k]).join(' ').length > 26 ? 'kucuk' : '';
    el.innerHTML = g.map((k) => `<span class="k" data-k="${k}">${esc(yazi.kelimeler[k].toLocaleUpperCase('tr'))}</span>`).join(' ');
    el.style.fontSize = '';
    let fs = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > el.clientWidth + 2 && fs > 18) { fs -= 2; el.style.fontSize = fs + 'px'; }
  }
  el.querySelectorAll('.k').forEach((s) => s.classList.toggle('simdi', Number(s.dataset.k) === i));
}

// ---------- Akış ----------
function thinking(job, cards) {
  curId = job.id; yazi = null; sahteKonusma = false;
  try { audio.pause(); } catch {}
  document.body.classList.add('dusunuyor', 'aktif');
  $('isim').textContent = job.nickname;
  $('kademe').textContent = job.spreadAd || '';
  const av = $('avatar'); if (job.avatar) { av.src = job.avatar; av.style.display = 'block'; } else av.style.display = 'none';
  $('isimEtiketi').classList.add('goster');
  $('altyazi').className = 'kucuk';
  $('altyazi').innerHTML = `<span class="k simdi">KARTLAR ÇEKİLİYOR</span>`;
  kartlariCek(cards);
}
async function reading(r) {
  curId = r.id;
  document.body.classList.remove('dusunuyor');
  const tahmini = 4 + r.text.split(/\s+/).length * 0.42;
  if (r.audio) {
    try {
      sesGrafigi();
      if (actx.state === 'suspended') await actx.resume();
      audio.src = /^https?:/.test(r.audio) ? r.audio : SERVER + r.audio;
      await new Promise((ok, no) => { audio.onloadedmetadata = ok; audio.onerror = no; setTimeout(ok, 4000); });
      altyaziHazirla(r.text, isFinite(audio.duration) ? audio.duration : (r.sure || tahmini));
      audio.onended = () => bitti(r.id);
      await audio.play();
      $('sesKilit').style.display = 'none';
      return;
    } catch (e) {
      $('sesKilit').style.display = 'block';
    }
  }
  // ses yoksa: sahte ağız + tahmini süre
  altyaziHazirla(r.text, tahmini);
  sahteKonusma = true;
  setTimeout(() => { if (curId === r.id) { sahteKonusma = false; bitti(r.id); } }, tahmini * 1000);
}
function bitti(id) { if (ws && ws.readyState === 1 && !KANAL) ws.send(JSON.stringify({ type: 'done', id })); }
function idle() {
  yazi = null; sahteKonusma = false;
  try { audio.pause(); } catch {}
  document.body.classList.remove('dusunuyor', 'aktif');
  $('isimEtiketi').classList.remove('goster');
  $('altyazi').innerHTML = '';
  document.querySelectorAll('.kart').forEach((k) => k.classList.add('git'));
  setTimeout(() => { if (!yazi) $('kartlar').innerHTML = ''; }, 600);
}
let menuCizildi = '';
function renderState(s) {
  const t = Array.isArray(s.tiers) && s.tiers[0] && s.tiers[0].key ? s.tiers : VARSAYILAN_KADEME;
  const html = `<div class="baslik">HEDİYE AT, <b>FALINA BAKAYIM</b></div><div class="grid">` +
    t.map((x) => `<div class="kutu${x.key === 'genel' ? ' vip' : ''}"><div class="ikon">${IKON[x.key] || '🔮'}</div>
      <div class="ad">${KISA[x.key] || x.ad}</div><div class="fiyat">${x.key === 'tek' ? 'GÜL · 1 jeton' : x.min + ' jeton'}</div></div>`).join('') +
    `</div><div class="not">Seri hediyeler toplanır · <b>10 Gül = Üçlü Tarot</b></div>`;
  if (html !== menuCizildi) { $('menu').innerHTML = html; menuCizildi = html; }
  const n = (s.queue || []).length;
  $('sira').style.display = n ? 'block' : 'none';
  $('sira').textContent = `Sırada: ${n}`;
}
function mesaj(m) {
  if (m.tiers) renderState({ tiers: m.tiers, queue: new Array(m.q || 0).fill(0) });
  if (m.type === 'state') renderState(m.state);
  if (m.type === 'thinking') thinking(m.job, m.cards);
  if (m.type === 'reading') reading(m.reading);
  if (m.type === 'idle') idle();
}
function kanalBaglan() {
  renderState({ tiers: VARSAYILAN_KADEME, queue: [] });
  const es = new EventSource(`https://ntfy.sh/${KANAL}/sse`);
  es.onmessage = (e) => { try { const d = JSON.parse(e.data); if (d.event === 'message' && d.message) mesaj(JSON.parse(d.message)); } catch {} };
}
function connect() {
  if (KANAL) return kanalBaglan();
  ws = new WebSocket(SERVER ? SERVER.replace(/^http/, 'ws') : `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`);
  ws.onopen = () => ws.send(JSON.stringify({ type: 'hello', speaks: true }));
  ws.onclose = () => setTimeout(connect, 2000);
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'state') renderState(m.state);
    if (m.type === 'thinking') thinking(m.job, m.cards);
    if (m.type === 'reading') reading(m.reading);
    if (m.type === 'idle') idle();
  };
}
$('sesKilit').onclick = async () => { sesGrafigi(); await actx.resume(); try { await audio.play(); } catch {} $('sesKilit').style.display = 'none'; };

function roma(n) { if (!n) return '0'; const m = [[10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']]; let s = ''; for (const [v, r] of m) while (n >= v) { s += r; n -= v; } return s; }
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

kur().then(() => { requestAnimationFrame(agizDongu); connect(); });
</script>
